<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 318 258" width="318" height="258" role="img" aria-label="Stream Deck Mini — 3×2 key stream deck">
  <title>Stream Deck Mini</title>
  <defs>
    <linearGradient id="bodymini" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3d45"/>
      <stop offset="1" stop-color="#25272d"/>
    </linearGradient>
    <linearGradient id="idlemini" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2027"/>
      <stop offset="1" stop-color="#0e0f13"/>
    </linearGradient>
    <linearGradient id="glossmini" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="knobmini" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3d45"/>
      <stop offset="1" stop-color="#14161a"/>
    </linearGradient>
    <filter id="shadowmini" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- stand -->
  <path d="M 32 204 H 286 L 296 244 H 22 Z" fill="#25272d" opacity="0.95"/>

  <!-- chassis -->
  <g filter="url(#shadowmini)">
    <rect x="28" y="28" width="262" height="202" rx="18" fill="url(#bodymini)"/>
    <rect x="28.5" y="28.5" width="261" height="201" rx="17.5" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
  </g>
  

  <!-- key panel recess -->
  <rect x="45" y="61" width="228" height="152" rx="14" fill="#000000" opacity="0.22"/>

  <!-- keys -->
  <g><g transform="translate(52,68)"><rect width="62" height="62" rx="9" fill="#14161a"/><rect x="1" y="1" width="60" height="60" rx="8" fill="url(#idlemini)"/><rect x="1" y="1" width="60" height="60" rx="8" fill="url(#glossmini)"/><rect x="1.5" y="1.5" width="59" height="59" rx="7.5" fill="none" stroke="#ffffff" stroke-opacity="0.07"/></g><g transform="translate(128,68)"><rect width="62" height="62" rx="9" fill="#14161a"/><rect x="1" y="1" width="60" height="60" rx="8" fill="url(#idlemini)"/><rect x="1" y="1" width="60" height="60" rx="8" fill="url(#glossmini)"/><rect x="1.5" y="1.5" width="59" height="59" rx="7.5" fill="none" stroke="#ffffff" stroke-opacity="0.07"/></g><g transform="translate(204,68)"><rect width="62" height="62" rx="9" fill="#14161a"/><rect x="1" y="1" width="60" height="60" rx="8" fill="url(#idlemini)"/><rect x="1" y="1" width="60" height="60" rx="8" fill="#4f63d2" opacity="0.89"/><rect x="1" y="1" width="60" height="60" rx="8" fill="url(#glossmini)"/><rect x="1.5" y="1.5" width="59" height="59" rx="7.5" fill="none" stroke="#ffffff" stroke-opacity="0.07"/></g><g transform="translate(52,144)"><rect width="62" height="62" rx="9" fill="#14161a"/><rect x="1" y="1" width="60" height="60" rx="8" fill="url(#idlemini)"/><rect x="1" y="1" width="60" height="60" rx="8" fill="url(#glossmini)"/><rect x="1.5" y="1.5" width="59" height="59" rx="7.5" fill="none" stroke="#ffffff" stroke-opacity="0.07"/></g><g transform="translate(128,144)"><rect width="62" height="62" rx="9" fill="#14161a"/><rect x="1" y="1" width="60" height="60" rx="8" fill="url(#idlemini)"/><rect x="1" y="1" width="60" height="60" rx="8" fill="url(#glossmini)"/><rect x="1.5" y="1.5" width="59" height="59" rx="7.5" fill="none" stroke="#ffffff" stroke-opacity="0.07"/></g><g transform="translate(204,144)"><rect width="62" height="62" rx="9" fill="#14161a"/><rect x="1" y="1" width="60" height="60" rx="8" fill="url(#idlemini)"/><rect x="1" y="1" width="60" height="60" rx="8" fill="#4f63d2" opacity="0.80"/><rect x="1" y="1" width="60" height="60" rx="8" fill="url(#glossmini)"/><rect x="1.5" y="1.5" width="59" height="59" rx="7.5" fill="none" stroke="#ffffff" stroke-opacity="0.07"/></g></g>
  
  

  <!-- wordmark + grid caption -->
  <text x="159" y="53" text-anchor="middle" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="2.4" fill="#9aa0ad">ELGATO</text>
  <text x="266" y="53" text-anchor="end" font-family="Inter, Helvetica Neue, Arial, sans-serif" font-size="12" fill="#9aa0ad" opacity="0.7">3×2</text>
</svg>
