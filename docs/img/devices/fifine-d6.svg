<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 462 330" width="462" height="330" role="img" aria-label="Fifine AmpliGame D6 — 5×3 key stream deck">
  <title>Fifine AmpliGame D6</title>
  <defs>
    <linearGradient id="bodyfifined6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23252b"/>
      <stop offset="1" stop-color="#121317"/>
    </linearGradient>
    <linearGradient id="idlefifined6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2027"/>
      <stop offset="1" stop-color="#0e0f13"/>
    </linearGradient>
    <linearGradient id="glossfifined6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="knobfifined6" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23252b"/>
      <stop offset="1" stop-color="#08090b"/>
    </linearGradient>
    <filter id="shadowfifined6" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- stand -->
  <path d="M 32 276 H 430 L 440 316 H 22 Z" fill="#121317" opacity="0.95"/>

  <!-- chassis -->
  <g filter="url(#shadowfifined6)">
    <rect x="28" y="28" width="406" height="274" rx="14" fill="url(#bodyfifined6)"/>
    <rect x="28.5" y="28.5" width="405" height="273" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
  </g>
  <rect x="38" y="297" width="386" height="4" rx="2" fill="#f59f00" opacity="0.75"/>

  <!-- key panel recess -->
  <rect x="45" y="61" width="372" height="224" rx="14" fill="#000000" opacity="0.22"/>

