<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6e7781"/>
    </marker>
  </defs>

  <!-- USB Stream Deck -->
  <rect x="10" y="60" width="150" height="60" rx="8" fill="#f6f8fa" stroke="#6e7781" stroke-width="1.5"/>
  <text x="85" y="85" text-anchor="middle" font-size="13" fill="#24292f">USB Stream Deck</text>
  <text x="85" y="102" text-anchor="middle" font-size="11" fill="#6e7781">(Mirabox / Ajazz / Elgato / ...)</text>

  <!-- DeckBridge -->
  <rect x="285" y="50" width="150" height="80" rx="8" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text x="360" y="85" text-anchor="middle" font-size="14" font-weight="600" fill="#0969da">DeckBridge</text>
  <text x="360" y="103" text-anchor="middle" font-size="11" fill="#57606a">HID ↔ CORA bridge</text>

  <!-- Elgato app -->
  <rect x="560" y="10" width="150" height="60" rx="8" fill="#f6f8fa" stroke="#6e7781" stroke-width="1.5"/>
  <text x="635" y="35" text-anchor="middle" font-size="13" fill="#24292f">Elgato Stream</text>
  <text x="635" y="52" text-anchor="middle" font-size="13" fill="#24292f">Deck app</text>

  <!-- Web UI -->
  <rect x="560" y="130" width="150" height="60" rx="8" fill="#f6f8fa" stroke="#6e7781" stroke-width="1.5"/>
  <text x="635" y="155" text-anchor="middle" font-size="13" fill="#24292f">Web UI</text>
  <text x="635" y="172" text-anchor="middle" font-size="11" fill="#6e7781">Set it up once, then forget it.</text>

  <!-- arrows -->
  <line x1="160" y1="90" x2="280" y2="90" stroke="#6e7781" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="220" y="82" text-anchor="middle" font-size="10" fill="#6e7781">HID</text>

  <line x1="435" y1="75" x2="555" y2="40" stroke="#6e7781" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="500" y="47" text-anchor="middle" font-size="10" fill="#6e7781">CORA / TCP, LAN</text>

  <line x1="435" y1="105" x2="555" y2="150" stroke="#6e7781" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="505" y="140" text-anchor="middle" font-size="10" fill="#6e7781">HTTP/WS</text>
</svg>
