<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 442 320" width="442" height="320" role="img" aria-label="Ulanzi Stream Controller D200 — 5×3 key stream deck">
  <title>Ulanzi Stream Controller D200</title>
  <defs>
    <linearGradient id="bodyulanzid200" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23252b"/>
      <stop offset="1" stop-color="#121317"/>
    </linearGradient>
    <linearGradient id="idleulanzid200" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e2027"/>
      <stop offset="1" stop-color="#0e0f13"/>
    </linearGradient>
    <linearGradient id="glossulanzid200" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="knobulanzid200" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23252b"/>
      <stop offset="1" stop-color="#08090b"/>
    </linearGradient>
    <filter id="shadowulanzid200" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- stand -->
  <path d="M 32 266 H 410 L 420 306 H 22 Z" fill="#121317" opacity="0.95"/>

  <!-- chassis -->
  <g filter="url(#shadowulanzid200)">
    <rect x="28" y="28" width="386" height="264" rx="16" fill="url(#bodyulanzid200)"/>
    <rect x="28.5" y="28.5" width="385" height="263" rx="15.5" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
  </g>
  

  <!-- key panel recess -->
  <rect x="45" y="61" width="352" height="214" rx="14" fill="#000000" opacity="0.22"/>

