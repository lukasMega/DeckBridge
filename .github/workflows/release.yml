name: Release deckbridge

# Version bumps run from main so every release can reuse main-scoped caches.
# The release job creates the immutable deckbridge-v* tag after builds pass.
on:
  push:
    branches: [main]
    paths: ['ts/package.json']
  workflow_dispatch:
    inputs:
      skip_release:
        description: 'Skip creating GitHub Release (dry run)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      package_version: ${{ steps.version.outputs.package_version }}
      tag: ${{ steps.version.outputs.tag }}
      should_build: ${{ steps.version.outputs.should_build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./ts/package.json').version")
          TAG="deckbridge-v$VERSION"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]] && git rev-parse "$TAG" >/dev/null 2>&1; then
            SHOULD_BUILD=false
          else
            SHOULD_BUILD=true
          fi
          {
            echo "version=$VERSION"
            echo "package_version=v$VERSION"
            echo "tag=$TAG"
            echo "should_build=$SHOULD_BUILD"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest       # Apple Silicon (arm64)
            platform: macos-arm64
            triple: aarch64-apple-darwin
            tauri: '1'
          - os: macos-15-intel     # Intel (x86_64) — no prebuilt slim asset
            platform: macos-x86_64
            triple: x86_64-apple-darwin
            tauri: '1'
            from_source: '1'
          # Linux re-enabled: the old blocker was mise-action blind-installing the
          # github:lukasMega/txiki.js mise tool (no linux-arm64 asset), and mise.toml
          # no longer declares that tool at all.
          # See .claude/plans/2026-07-31_linux-build-support.md.
          # Both Linux jobs run on 24.04 images on purpose: the prebuilt slim
          # runtime is itself built on 24.04, so a 22.04 runner dies at
          # `tjs compile` with "GLIBC_2.38 not found". Consequence: the shipped
          # Linux binaries need glibc >= 2.38 (Ubuntu 24.04+, Debian 13+). To
          # lower that floor, set from_source on the job and move it back to a
          # 22.04 image — the same slim profile then links against glibc 2.35.
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-arm64

    runs-on: ${{ matrix.os }}

    # Every platform ships the SLIM txiki.js runtime (no TLS/WASM/SQLite/mimalloc,
    # MinSizeRel + compressed bytecode + stripped) — but it is *downloaded*
    # prebuilt, so most platforms need no C/C++ toolchain and no from-source build.
    # Only macos-x86_64 has no published asset and sets from_source, which makes
    # tjs-setup run scripts/tjs-build.mjs (same profile, built locally).
    env:
      TJS_FROM_SOURCE: ${{ matrix.from_source }}

    steps:
      - uses: actions/checkout@v7

      - name: Sync Tauri version
        if: matrix.tauri == '1'
        run: node scripts/sync-version.mjs

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust -> target
            src-tauri -> target
          shared-key: release-${{ matrix.platform }}

      # Cache the slim txiki.js runtime so it builds once per platform per build
      # config change (the from-source build clones + compiles txiki.js, which is
      # slow). On a hit the binary is restored to $TJS and tjs-setup skips the
      # rebuild. Key is invalidated by the pinned version (mise.toml) or the
      # build script itself (tjs-build.mjs, e.g. its cmake flags).
      - name: Cache slim txiki.js runtime
        uses: actions/cache@v6
        with:
          path: vendor/txiki.js/build/tjs
          key: tjs-slim-${{ matrix.platform }}-${{ hashFiles('mise.toml', 'scripts/tjs-build.mjs', 'scripts/tjs-download.mjs') }}

      - name: Install libhidapi (macOS)
        if: startsWith(matrix.os, 'macos')
        run: brew install hidapi

      # Linux: libhidapi/libudev for the app, libffi for the runtime's tjs:ffi
      # dlopen, and the GTK/appindicator/xdo trio for the deckbridge-tray crate.
      # (cmake/build-essential stay: harmless on the download path, and needed if
      # this job is ever flipped to from_source.)
      - name: Install system deps (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        # See the note on ci.yml's apt steps: the runner image's preinstalled
        # Google Chrome source can fail `apt-get update` outright when Google's
        # index drifts, and nothing here installs from it.
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y libhidapi-dev libudev-dev libffi-dev cmake build-essential libgtk-3-dev libxdo-dev libayatana-appindicator3-dev

      - uses: jdx/mise-action@v4

      - name: Compile
        run: mise run compile

      # Ad-hoc sign deckbridge-tray only. The relay (deckbridge) is NOT re-signed:
      # `tjs compile` appends the bytecode payload after the Mach-O and ships a
      # linker-signed ad-hoc signature the kernel runs leniently; `codesign
      # --force` would replace it and fail strict validation on the trailing data
      # ("main executable failed strict validation"). The as-compiled signature is
      # what ships.
      - name: Ad-hoc sign deckbridge-tray (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          codesign --force --sign - --timestamp=none rust/target/release/deckbridge-tray
          codesign -dv deckbridge 2>&1 | head -3

      - name: Package
        run: node scripts/package.mjs "${{ needs.prepare.outputs.package_version }}"

      - name: Smoke-test deps (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get install -y netcat-openbsd unzip curl

      - name: Smoke test (boots cleanly, serves, shuts down)
        run: ./scripts/e2e-smoke.sh "$(find dist -maxdepth 1 -name '*.zip' -printf '%T@ %p\n' | sort -rn | head -1 | cut -d' ' -f2-)"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Install pinned Tauri CLI
        if: matrix.tauri == '1'
        working-directory: src-tauri
        run: pnpm install --frozen-lockfile

      - name: Stage Tauri sidecars
        if: matrix.tauri == '1'
        run: |
          mkdir -p src-tauri/binaries
          cp deckbridge "src-tauri/binaries/deckbridge-${{ matrix.triple }}"
          cp rust/target/release/deckbridge-tray "src-tauri/binaries/deckbridge-tray-${{ matrix.triple }}"
          chmod +x "src-tauri/binaries/deckbridge-${{ matrix.triple }}" "src-tauri/binaries/deckbridge-tray-${{ matrix.triple }}"
          codesign --force --sign - --timestamp=none "src-tauri/binaries/deckbridge-tray-${{ matrix.triple }}"

      # Intel builds compile txiki.js locally. Its source tree is roughly 1 GB
      # and is no longer needed after sidecars are staged. DMG creation needs
      # temporary disk space, so reclaim it before hdiutil runs.
      - name: Reclaim Tauri disk space
        if: matrix.tauri == '1' && matrix.from_source == '1'
        run: |
          du -sh vendor/txiki.js-src || true
          rm -rf vendor/txiki.js-src
          df -h .

      # hdiutil intermittently returns "Resource busy" on GitHub's Intel macOS
      # runners. Tauri's bundled create-dmg 1.2.1 does not retry image creation,
      # so retry the incremental build twice before failing the job.
      - name: Build Tauri dmg
        if: matrix.tauri == '1'
        working-directory: src-tauri
        run: |
          for attempt in 1 2 3; do
            if pnpm tauri build --bundles dmg --verbose; then
              exit 0
            fi
            if [[ "$attempt" == 3 ]]; then
              exit 1
            fi
            echo "DMG build failed; retrying in $((attempt * 10)) seconds."
            sleep $((attempt * 10))
          done

      - uses: actions/upload-artifact@v7
        if: matrix.tauri == '1'
        with:
          name: ${{ matrix.platform }}-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # Windows is packaged differently: instead of a raw zip, the binary is wrapped
  # in a Tauri v2 supervisor shell (src-tauri/) and shipped as an NSIS installer
  # (Scoop/winget-friendly, no Gatekeeper/SmartScreen friction via Scoop). The
  # relay binary + deckbridge-tray ride along as Tauri sidecars (externalBin), so they
  # must be renamed to the MSVC target triple before `pnpm tauri build` (G2).
  build-windows:
    name: Build windows-x86_64 (Tauri NSIS)
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: windows-latest
    # No TJS_FROM_SOURCE here (unlike the Unix jobs above): the from-source build
    # (scripts/tjs-build.mjs) is unverified against MSVC-only runners. tjs-setup
    # downloads the prebuilt `txiki-slim-ffi-windows-x86_64.zip` instead — since
    # the switch to the slim release that download IS the slim runtime, so this
    # job is no longer trading size for reliability.

    steps:
      - uses: actions/checkout@v7

      # Stamps ts/package.json's version (the single source of truth) into
      # src-tauri/Cargo.toml + tauri.conf.json so the NSIS installer version
      # is correct without a build-time -c override.
      - name: Sync version into Cargo.toml/tauri.conf.json
        run: node scripts/sync-version.mjs

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust -> target
            src-tauri -> target
          shared-key: release-windows-x86_64

      - name: Cache txiki.js runtime
        uses: actions/cache@v6
        with:
          path: vendor/txiki.js/build/tjs.exe
          key: tjs-windows-x86_64-${{ hashFiles('mise.toml') }}

      - name: Cache hidapi.dll
        id: hidapi-cache
        uses: actions/cache@v6
        with:
          path: vendor/hidapi/hidapi.dll
          key: hidapi-0.15.0-windows-x86_64

      # Windows ships no system hidapi.dll (B3). Build once, then reuse its
      # stable output across main-scoped releases.
      - name: Build hidapi.dll
        if: steps.hidapi-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone --depth 1 --branch hidapi-0.15.0 https://github.com/libusb/hidapi C:\hidapi-src
          cmake -B C:\hidapi-build -S C:\hidapi-src
          cmake --build C:\hidapi-build --config Release
          $dll = Get-ChildItem -Path C:\hidapi-build -Filter hidapi.dll -Recurse | Select-Object -First 1
          if (-not $dll) { Write-Error "hidapi.dll not found after build"; exit 1 }
          New-Item -ItemType Directory -Force -Path "vendor/hidapi" | Out-Null
          Copy-Item $dll.FullName "vendor/hidapi/hidapi.dll"

      - name: Configure hidapi.dll
        shell: pwsh
        run: echo "HIDAPI_LIB=${{ github.workspace }}\vendor\hidapi\hidapi.dll" >> $env:GITHUB_ENV

      - uses: jdx/mise-action@v4

      - name: Install pinned Tauri CLI
        working-directory: src-tauri
        run: pnpm install --frozen-lockfile

      # Produces the Windows relay binary (deckbridge[.exe]) via the same build
      # chain the other platforms use. txiki's `compile` emits a PE executable.
      - name: Compile relay binary
        run: mise run compile

      # Boot the just-compiled binary in mock mode (no HID device needed),
      # poll the WebUI until it responds, then kill it — mirrors the
      # boot/serve/shutdown checks in scripts/e2e-smoke.sh (bash, POSIX-only)
      # for the platform that script can't run on.
      - name: Smoke test (mock mode, poll WebUI, then kill)
        shell: pwsh
        run: |
          $relay = if (Test-Path "deckbridge.exe") { "deckbridge.exe" } else { "deckbridge" }
          $env:DECKBRIDGE_MOCK = "1"
          $proc = Start-Process -FilePath ".\$relay" -PassThru `
            -RedirectStandardOutput "smoke-stdout.log" -RedirectStandardError "smoke-stderr.log"
          $ready = $false
          for ($i = 0; $i -lt 60; $i++) {
            try {
              $resp = Invoke-WebRequest -Uri "http://localhost:3000" -UseBasicParsing -TimeoutSec 2
              if ($resp.StatusCode -eq 200) { $ready = $true; break }
            } catch {}
            if ($proc.HasExited) {
              Write-Host "FAIL: process exited before becoming ready"
              Get-Content smoke-stderr.log -ErrorAction SilentlyContinue
              exit 1
            }
            Start-Sleep -Milliseconds 500
          }
          if (-not $ready) {
            Write-Host "FAIL: WebUI never responded with 200 after 30s"
            Get-Content smoke-stderr.log -ErrorAction SilentlyContinue
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            exit 1
          }
          Write-Host "Smoke test OK: WebUI responded 200"
          Stop-Process -Id $proc.Id -Force

      # Tauri's bundler only picks up the sidecar whose filename matches the
      # build's target triple (G2), so copy both binaries into src-tauri/binaries/
      # with the -x86_64-pc-windows-msvc.exe suffix. `mise run compile` writes
      # either deckbridge or deckbridge.exe depending on txiki; handle both.
      - name: Stage sidecars for Tauri (target-triple names)
        shell: pwsh
        run: |
          $relay = if (Test-Path "deckbridge.exe") { "deckbridge.exe" } else { "deckbridge" }
          Copy-Item $relay "src-tauri/binaries/deckbridge-x86_64-pc-windows-msvc.exe" -Force
          Copy-Item "rust/target/release/deckbridge-tray.exe" "src-tauri/binaries/deckbridge-tray-x86_64-pc-windows-msvc.exe" -Force
          Get-ChildItem "src-tauri/binaries/"

      # tauri.conf.json's version was already stamped from ts/package.json by
      # the "Sync version" step above — no build-time override needed.
      # NSIS is fetched by the bundler; WebView2 is preinstalled on the runner.
      - name: Build Tauri NSIS installer
        shell: pwsh
        working-directory: src-tauri
        run: pnpm tauri build

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [prepare, build, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      # Scan every packaged binary before checksumming and publishing it.
      # freshclam updates signatures; clamscan exits 1 when malware is found.
      - name: Install ClamAV and update signatures
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav
          sudo systemctl stop clamav-freshclam.service || true
          sudo freshclam

      - name: Scan release artifacts for malware
        run: clamscan --recursive --infected artifacts

      # VirusTotal may share uploads. Throttle free API requests.
      - name: Upload release artifacts to VirusTotal
        continue-on-error: true
        uses: crazy-max/ghaction-virustotal@936d8c5c00afe97d3d9a1af26d017cfdf26800a2 # v5.0.0
        with:
          vt_api_key: ${{ secrets.VIRUSTOTAL_API_KEY }}
          request_rate: 4
          files: |
            artifacts/*.zip
            artifacts/*-setup.exe
            artifacts/*.dmg

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum ./*.zip ./*-setup.exe ./*.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release
        if: github.event_name == 'push' || inputs.skip_release == 'false'
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          tag_name: "${{ needs.prepare.outputs.tag }}"
          name: "${{ needs.prepare.outputs.tag }}"
          target_commitish: "${{ github.sha }}"
          body: |
            see docs: https://lukasmega.github.io/DeckBridge/
          files: |
            artifacts/*.zip
            artifacts/*-setup.exe
            artifacts/*.dmg
            artifacts/SHA256SUMS.txt
          fail_on_unmatched_files: true
