name: Release deckbridge

# Version bumps run from main so every release can reuse main-scoped caches.
# The release job creates the immutable deckbridge-v* tag after builds pass.
on:
  push:
    branches: [main]
    paths: ['ts/package.json']
  workflow_dispatch:
    inputs:
      skip_release:
        description: 'Skip creating GitHub Release (dry run)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

permissions:
  contents: read

concurrency:
  group: deckbridge-release
  cancel-in-progress: false

# Packaged release binaries bypass telemetry-env.ts's CI detection.
env:
  DECKBRIDGE_NO_TELEMETRY: '1'

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      should_build: ${{ steps.version.outputs.should_build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION=$(node -p "require('./ts/package.json').version")
          TAG="deckbridge-v$VERSION"
          if [[ "$GITHUB_EVENT_NAME" == "push" ]] && git rev-parse "$TAG" >/dev/null 2>&1; then
            SHOULD_BUILD=false
          else
            SHOULD_BUILD=true
          fi
          {
            echo "tag=$TAG"
            echo "should_build=$SHOULD_BUILD"
          } >> "$GITHUB_OUTPUT"

  virustotal-poc:
    name: Scan isolation samples
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    uses: ./.github/workflows/virustotal-poc.yml
    with:
      scan: true
    secrets:
      VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest       # Apple Silicon (arm64)
            platform: macos-arm64
            triple: aarch64-apple-darwin
            tauri: '1'
          - os: macos-15-intel     # Intel (x86_64) — no prebuilt slim asset
            platform: macos-x86_64
            triple: x86_64-apple-darwin
            tauri: '1'
            from_source: '1'
          # Prebuilt Linux runtime needs glibc >= 2.38 (Ubuntu 24.04+).
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-arm64

    runs-on: ${{ matrix.os }}

    # Intel macOS builds txiki.js locally; other platforms download it.
    env:
      TJS_FROM_SOURCE: ${{ matrix.from_source }}

    steps:
      - uses: actions/checkout@v7

      - name: Sync Tauri version
        if: matrix.tauri == '1'
        run: node scripts/sync-version.mjs

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust -> target
            src-tauri -> target
          shared-key: release-${{ matrix.platform }}

      # Cache invalidates when runtime version or build scripts change.
      - name: Cache slim txiki.js runtime
        uses: actions/cache@v6
        with:
          path: vendor/txiki.js/build/tjs
          key: tjs-slim-${{ matrix.platform }}-${{ hashFiles('mise.toml', 'scripts/tjs-build.mjs', 'scripts/tjs-download.mjs') }}

      - name: Install libhidapi (macOS)
        if: startsWith(matrix.os, 'macos')
        run: brew install hidapi

      # Keep toolchain packages for possible from-source builds.
      - name: Install system deps (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          # Chrome's preinstalled source sometimes breaks apt-get update.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y libhidapi-dev libudev-dev libffi-dev cmake build-essential libgtk-3-dev libxdo-dev libayatana-appindicator3-dev netcat-openbsd unzip curl

      - uses: jdx/mise-action@v4

      - name: Compile
        run: mise run compile

      # Never re-sign relay: its bytecode payload trails the Mach-O signature.
      - name: Ad-hoc sign deckbridge-tray (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          codesign --force --sign - --timestamp=none rust/target/release/deckbridge-tray
          codesign -dv deckbridge 2>&1 | head -3

      - name: Package
        run: node scripts/package.mjs

      - name: Smoke test (boots cleanly, serves, shuts down)
        run: ./scripts/e2e-smoke.sh

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Install pinned Tauri CLI
        if: matrix.tauri == '1'
        working-directory: src-tauri
        run: pnpm install --frozen-lockfile

      - name: Stage Tauri sidecars
        if: matrix.tauri == '1'
        run: |
          mkdir -p src-tauri/binaries
          cp deckbridge "src-tauri/binaries/deckbridge-${{ matrix.triple }}"
          cp rust/target/release/deckbridge-tray "src-tauri/binaries/deckbridge-tray-${{ matrix.triple }}"
          chmod +x "src-tauri/binaries/deckbridge-${{ matrix.triple }}" "src-tauri/binaries/deckbridge-tray-${{ matrix.triple }}"
          codesign --force --sign - --timestamp=none "src-tauri/binaries/deckbridge-tray-${{ matrix.triple }}"

      # Intel source tree needs removal before DMG creation (~1 GB).
      - name: Reclaim Tauri disk space
        if: matrix.tauri == '1' && matrix.from_source == '1'
        run: |
          du -sh vendor/txiki.js-src || true
          rm -rf vendor/txiki.js-src
          df -h .

      # Retry intermittent hdiutil "Resource busy" failures.
      - name: Build Tauri dmg
        if: matrix.tauri == '1'
        working-directory: src-tauri
        run: |
          for attempt in 1 2 3; do
            if pnpm tauri build --bundles dmg --verbose; then
              exit 0
            fi
            if [[ "$attempt" == 3 ]]; then
              exit 1
            fi
            echo "DMG build failed; retrying in $((attempt * 10)) seconds."
            sleep $((attempt * 10))
          done

      - uses: actions/upload-artifact@v7
        if: matrix.tauri == '1'
        with:
          name: ${{ matrix.platform }}-dmg
          path: src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  # Windows ships both portable ZIP and Tauri NSIS installer.
  build-windows:
    name: Build windows-x86_64 (NSIS + portable)
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: windows-latest
    # Windows downloads txiki.js; source build is unverified on MSVC.

    steps:
      - uses: actions/checkout@v7

      - name: Sync version into Cargo.toml/tauri.conf.json
        run: node scripts/sync-version.mjs

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust -> target
            src-tauri -> target
          shared-key: release-windows-x86_64

      - name: Cache txiki.js runtime
        uses: actions/cache@v6
        with:
          path: vendor/txiki.js/build/tjs.exe
          key: tjs-windows-x86_64-${{ hashFiles('mise.toml') }}

      - name: Cache hidapi.dll
        id: hidapi-cache
        uses: actions/cache@v6
        with:
          path: vendor/hidapi/hidapi.dll
          key: hidapi-0.15.0-windows-x86_64

      # Build hidapi.dll once, then reuse its cache.
      - name: Build hidapi.dll
        if: steps.hidapi-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch hidapi-0.15.0 https://github.com/libusb/hidapi C:\hidapi-src
          cmake -B C:\hidapi-build -S C:\hidapi-src
          cmake --build C:\hidapi-build --config Release
          $dll = Get-ChildItem -Path C:\hidapi-build -Filter hidapi.dll -Recurse | Select-Object -First 1
          if (-not $dll) { Write-Error "hidapi.dll not found after build"; exit 1 }
          New-Item -ItemType Directory -Force -Path "vendor/hidapi" | Out-Null
          Copy-Item $dll.FullName "vendor/hidapi/hidapi.dll"

      - name: Configure hidapi.dll
        run: echo "HIDAPI_LIB=${{ github.workspace }}\vendor\hidapi\hidapi.dll" >> $env:GITHUB_ENV

      - uses: jdx/mise-action@v4

      - name: Install pinned Tauri CLI
        working-directory: src-tauri
        run: pnpm install --frozen-lockfile

      # Runtime needs icon stamping before relay compilation.
      - name: Set up txiki.js runtime
        run: mise run tjs-setup

      # Stamping compiled relay would erase its PE bytecode overlay.
      - name: Stamp icon + version info into the runtime
        run: |
          Invoke-WebRequest -Uri "https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe" -OutFile rcedit.exe
          ./scripts/stamp-exe.ps1 -Target "vendor/txiki.js/build/tjs.exe" -Rcedit "rcedit.exe"

      - name: Compile relay binary
        run: mise run compile

      # Tray binary has no overlay; stamp after compilation.
      - name: Stamp icon + version info into the tray binary
        run: ./scripts/stamp-exe.ps1 -Target "rust/target/release/deckbridge-tray.exe" -Rcedit "rcedit.exe"

      - name: Smoke test (real mode, poll WebUI, then kill)
        run: ./scripts/e2e-smoke.ps1

      # Package portable binaries before staging Tauri sidecars.
      - name: Package portable zip
        run: node scripts/package.mjs

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64-portable
          path: dist/*.zip
          if-no-files-found: error

      # Tauri requires sidecars named for the MSVC target triple.
      - name: Stage sidecars for Tauri (target-triple names)
        run: |
          $relay = if (Test-Path "deckbridge.exe") { "deckbridge.exe" } else { "deckbridge" }
          Copy-Item $relay "src-tauri/binaries/deckbridge-x86_64-pc-windows-msvc.exe" -Force
          Copy-Item "rust/target/release/deckbridge-tray.exe" "src-tauri/binaries/deckbridge-tray-x86_64-pc-windows-msvc.exe" -Force
          Get-ChildItem "src-tauri/binaries/"

      - name: Build Tauri NSIS installer
        working-directory: src-tauri
        run: pnpm tauri build

      - uses: actions/upload-artifact@v7
        with:
          name: windows-x86_64
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  publish-virustotal-docs:
    name: Publish VirusTotal comparison
    needs: [prepare, virustotal-poc, build, build-windows]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      docs_sha: ${{ steps.commit.outputs.sha }}
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: virustotal-poc-results-windows-x64
          path: poc-results/windows
      - uses: actions/download-artifact@v8
        with:
          name: virustotal-poc-results-macos-arm64
          path: poc-results/macos
      - name: Generate comparison page
        run: node .github/virustotal-poc/publish-results.mjs poc-results/windows/results-windows-x64.json poc-results/macos/results-macos-arm64.json
      - name: Commit comparison page
        id: commit
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.skip_release == 'false')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/virustotal.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: publish VirusTotal PoC results for ${{ needs.prepare.outputs.tag }}"
            git push origin HEAD:main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # GITHUB_TOKEN pushes do not trigger push workflows.
      - name: Deploy updated docs and wait
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.skip_release == 'false')
        env:
          GH_TOKEN: ${{ github.token }}
          DOC_SHA: ${{ steps.commit.outputs.sha }}
        run: |
          gh workflow run deploy-docs.yml --ref main
          run_id=''
          for _ in {1..30}; do
            run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-docs.yml/runs?event=workflow_dispatch&head_sha=$DOC_SHA&per_page=1" --jq '.workflow_runs[0].id // empty')
            [ -n "$run_id" ] && break
            sleep 10
          done
          [ -n "$run_id" ] || { echo 'Docs deployment run not found'; exit 1; }
          for _ in {1..180}; do
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq '.status + ":" + (.conclusion // "")')
            if [ "$state" = 'completed:success' ]; then
              exit 0
            fi
            if [[ "$state" == completed:* ]]; then
              echo "Docs deployment failed: $state"
              exit 1
            fi
            sleep 10
          done
          echo 'Docs deployment timed out'
          exit 1

  release:
    name: Publish GitHub Release
    needs: [prepare, build, build-windows, publish-virustotal-docs]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Needed for release scripts.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          ref: ${{ github.sha }}

      - uses: actions/download-artifact@v8
        with:
          path: downloaded

      # PoC samples (hello-tauri-setup.exe, hello-tauri.dmg) would match the release globs.
      - name: Collect release files, excluding VirusTotal PoC artifacts
        run: |
          mkdir artifacts
          for dir in downloaded/*/; do
            case "$(basename "$dir")" in virustotal-poc-*) continue ;; esac
            mv "$dir"* artifacts/
          done
          ls -la artifacts

      # Scan before checksumming and publishing; infections fail release.
      - name: Install ClamAV and update signatures
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav
          sudo systemctl stop clamav-freshclam.service || true
          sudo freshclam

      - name: Scan release artifacts for malware
        run: clamscan --recursive --infected artifacts

      # Per-file retries retain other links after transient failures.
      - name: Upload release artifacts to VirusTotal
        continue-on-error: true
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
          VT_OUT: ${{ github.workspace }}/vt-analysis.txt
        run: |
          if [ -z "${VT_API_KEY:-}" ]; then
            echo "::warning::VIRUSTOTAL_API_KEY not set; skipping scan uploads"
            : > "$VT_OUT"
            exit 0
          fi
          chmod +x .github/scripts/vt-upload.sh
          .github/scripts/vt-upload.sh artifacts/*.zip artifacts/*-setup.exe artifacts/*.dmg

      - name: Generate SHA256SUMS
        run: |
          cd artifacts
          sha256sum ./*.zip ./*-setup.exe ./*.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # Include every artifact, even when its VirusTotal scan failed.
      - name: Build release body
        env:
          VT_OUT: ${{ github.workspace }}/vt-analysis.txt
        run: bash .github/scripts/release-body.sh

      - name: Create release
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.skip_release == 'false')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          tag_name: "${{ needs.prepare.outputs.tag }}"
          name: "${{ needs.prepare.outputs.tag }}"
          target_commitish: "${{ needs.publish-virustotal-docs.outputs.docs_sha }}"
          body_path: release-body.md
          files: |
            artifacts/*.zip
            artifacts/*-setup.exe
            artifacts/*.dmg
            artifacts/SHA256SUMS.txt
          fail_on_unmatched_files: true
