name: CI deckbridge

# Fast feedback on every PR and push to main: lint, types, tests, knip (TS) plus
# rustfmt/clippy/tests + cargo-deny (Rust), workflow lint, secret scan, and spelling.
# The 4-platform build + e2e matrix lives in release.yml (tag-triggered) — CI stays
# single-OS for speed since these checks are platform-independent.
on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref (e.g. rapid PR pushes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── TS: lint (oxlint + eslint) • types (tsgo) • test (tjs) • knip • format ──
  checks:
    name: TS lint • types • test • knip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ci-checks builds deckbridge-native for FFI tests, so Rust + system deps needed.
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust (workspace target)
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ci-rust-${{ hashFiles('rust/**/Cargo.lock') }}
          restore-keys: ci-rust-

      # No TJS_FROM_SOURCE → tjs-setup downloads the prebuilt slim runtime (fast,
      # no toolchain). The slow from-source build is for platforms without an
      # asset (macos-x86_64) only.
      - name: Install system deps (libhidapi + libudev + libffi)
        # The runner image ships a Google Chrome apt source we never use — every
        # workflow that needs Chrome installs it via browser-actions/setup-chrome
        # (this job does so in the next step). When Google's Packages.gz drifts
        # from its own Release file, apt fails the entire `apt-get update` with a
        # Hash Sum mismatch and exit 100. Drop the source.
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y libhidapi-dev libudev-dev libffi-dev

      # ci-checks runs `test-client`, which spawns headless Chrome to exercise the
      # Preact web UI. Install it explicitly rather than relying on the runner
      # image's preinstalled google-chrome: that is undeclared (the apt step above
      # actively drops Google's source) and would surface as a spawn ENOENT the day
      # the image drops it. Unpinned "stable" on purpose — deploy-docs.yml pins
      # 151.0.7922.77 for a puppeteer page.close regression, which cannot affect us
      # (test-client spawns Chrome directly with --dump-dom, no puppeteer), and a
      # UI smoke test is more useful tracking the current browser.
      - name: Install Chrome (for the web-UI regression tests)
        id: chrome
        uses: browser-actions/setup-chrome@v2

      - uses: jdx/mise-action@v4

      # Cache the pnpm content-addressable store, not ts/node_modules: under pnpm
      # node_modules is a symlink farm pointing into the store, so restoring it
      # without the store yields dangling links.
      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: ci-pnpm-${{ hashFiles('ts/pnpm-lock.yaml') }}
          restore-keys: ci-pnpm-

      - name: ci-checks (lint, types, test, test-client, knip)
        run: mise run ci-checks
        env:
          # Consumed by ts/scripts/test-client.mjs; without it the script falls
          # back to a bare `google-chrome` on PATH.
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}

      # oxfmt has no --check flag; run it and fail if it rewrote any tracked source.
      - name: Format check (oxfmt)
        run: |
          mise run format
          if ! git diff --quiet -- ts/src ts/test e2e; then
            echo "::error::oxfmt produced changes — run 'mise run format' and commit."
            git --no-pager diff --stat -- ts/src ts/test e2e
            exit 1
          fi

  # ── Browser e2e: the real bundle in mock mode, driven through Lightpanda ──
  # Separate from `checks` because it needs a full `mise run build` (Rust cdylib +
  # tray + tjs runtime), which ci-checks deliberately avoids.
  e2e-app:
    name: e2e (web UI, Lightpanda)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust (workspace target)
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ci-e2e-rust-${{ hashFiles('rust/**/Cargo.lock') }}
          restore-keys: ci-e2e-rust-

      # See the `checks` job for why Google's apt source is removed first.
      - name: Install system deps (libhidapi + libudev + libffi + gtk for the tray)
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y libhidapi-dev libudev-dev libffi-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev

      - uses: jdx/mise-action@v4

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: ci-e2e-pnpm-${{ hashFiles('ts/pnpm-lock.yaml', 'e2e/pnpm-lock.yaml') }}
          restore-keys: ci-e2e-pnpm-

      # The Lightpanda binary is not in the npm package: `lightpanda install`
      # downloads a nightly whose identity is fixed by the exact @lightpanda/browser
      # pin, so the lockfile hash is the right cache key.
      - name: Cache Lightpanda binary
        uses: actions/cache@v6
        with:
          path: ~/.cache/lightpanda-node
          key: lightpanda-${{ hashFiles('e2e/pnpm-lock.yaml') }}

      - name: Type-check the e2e suite
        run: mise run e2e-types

      # CORA 5343/5344 are hardcoded and must be free; helpers/app-server.ts
      # preflights them and fails with a named error rather than timing out.
      - name: e2e (app)
        run: mise run e2e-app

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-app
          path: e2e/test-results
          retention-days: 7

  # ── Rust: rustfmt + clippy (-D warnings, both JPEG backends) + unit tests ──
  rust-lint:
    name: Rust fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (rust-toolchain.toml pins 1.95 + clippy/rustfmt)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust (workspace target)
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: ci-rustlint-${{ hashFiles('rust/**/Cargo.lock') }}
          restore-keys: ci-rustlint-

      # clippy compiles the whole workspace incl. deckbridge-tray (gtk/xdo/appindicator).
      - name: Install Rust system deps
        # See the note on the TS job's apt step: the preinstalled Google Chrome
        # source can break `apt-get update` outright, and we never install from it.
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y libhidapi-dev libudev-dev libffi-dev libgtk-3-dev libxdo-dev libayatana-appindicator3-dev

      - uses: jdx/mise-action@v4

      - name: rustfmt + clippy + test
        run: mise run rust-lint

  # ── Windows: cheap sanity check (bundle + cargo check both crates + tauri
  # check). NOT the full test suite (that needs $TJS + a built hidapi.dll —
  # covered by release.yml's build-windows job instead) ──
  windows:
    name: Windows bundle + cargo check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust (workspace target)
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
            src-tauri/target
          key: ci-rust-windows-${{ hashFiles('rust/**/Cargo.lock', 'src-tauri/Cargo.lock') }}
          restore-keys: ci-rust-windows-

      - uses: jdx/mise-action@v4

      # No hidapi.dll built here (that's release.yml's job) — EMBED_NATIVE_LIBS=0
      # skips ts/build.mjs's native-lib embed step (and its hard-fail-if-missing
      # HIDAPI_LIB check), so bundling doesn't need it. deckbridge-native.dll
      # still gets a real `cargo build --release` via the `ts` task's dependency
      # chain (Windows SDK headers are present natively on this runner, unlike
      # cross-compiling from macOS).
      - name: Bundle TypeScript (mise run ts, no native-lib embed)
        env:
          EMBED_NATIVE_LIBS: '0'
        run: mise run ts

      - name: cargo check (both native crates)
        run: |
          cargo check --manifest-path rust/Cargo.toml -p deckbridge-native
          cargo check --manifest-path rust/Cargo.toml -p deckbridge-tray

      - name: tauri-check
        run: mise run tauri-check

  # ── Supply-chain: advisories, licenses, bans, sources ──
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: rust/Cargo.toml
          command: check advisories licenses bans sources

  # ── Lint the GitHub Actions YAML itself (release.yml + this file) ──
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: raven-actions/actionlint@v2

  # ── Secret scan across full history (free for personal/public repos) ──
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Spell-check source + docs (allowlist in typos.toml) ──
  typos:
    name: typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@master
        with:
          config: .github/typos.toml
