# typos spell-check allowlist — protocol/domain terms that are not misspellings.
[files]
extend-exclude = [
  "ts/node_modules/",
  "rust/target/",
  "rust/jpeg-encoder/",
  "vendor/",
  "ts/package-lock.json",
  "**/*.lock",
  "graphify-out/",
  "dist/",
  "**/*.min.js",   # vendored minified libs
  "**/*.patch",    # vendored patches — git hashes trip the checker
]

[default]
# Keep en-us so US spellings in code/APIs (Serialize, Color, …) are not flagged.
# British spellings used in prose are accepted via extend-words below instead —
# en-gb would (wrongly) flag those US programming identifiers.
locale = "en-us"

[default.extend-words]
CORA = "CORA"
Elgato = "Elgato"
mira = "mira"
txiki = "txiki"
hidapi = "hidapi"
mdns = "mdns"
Mirabox = "Mirabox"
Ajazz = "Ajazz"
QuickJS = "QuickJS"
libuv = "libuv"
libffi = "libffi"
cdylib = "cdylib"
oxlint = "oxlint"
oxfmt = "oxfmt"
knip = "knip"
tjs = "tjs"
# British spellings used in prose — accepted, not corrected to US.
behaviour = "behaviour"
behaviours = "behaviours"
behavioural = "behavioural"
colour = "colour"
colours = "colours"
centre = "centre"
centred = "centred"
centring = "centring"
honour = "honour"
honours = "honours"
honouring = "honouring"
initialise = "initialise"
initialised = "initialised"
initialises = "initialises"
labelled = "labelled"
normalise = "normalise"
normalises = "normalises"
signalling = "signalling"
# Legit domain tokens flagged as typos.
IST = "IST"      # India Standard Time (worldclock example)
Nd = "Nd"        # "N days" shorthand (countdown plugin)
WRK = "WRK"      # Mermaid node-id prefix in ARCHITECTURE.md
abd = "abd"      # deliberate test-data string ("abc" vs "abd")
alls = "alls"    # "catch-alls" (plural of catch-all)

[default.extend-identifiers]
PNGs = "PNGs"    # plural of PNG in prose
APPn = "APPn"    # JPEG APP0..APP15 marker family
