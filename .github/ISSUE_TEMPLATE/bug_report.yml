name: Bug report
description: Report a defect in the deckbridge binary
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please fill out the fields
        below. Do **not** report security vulnerabilities here — see
        [SECURITY.md](../blob/main/.github/SECURITY.md).
  - type: input
    id: hardware
    attributes:
      label: Device model
      description: >-
        e.g. Mirabox 293V3, Mirabox 293S, K1 Pro, Stream Deck Mini, Stream Deck MK.2,
        Ajazz AKP153E/R (rev. 1 or rev. 2), Fifine AmpliGame D6 (rev. 1 or rev. 2), Mars
        Gaming MSD-ONE, Mad Dog GK150K, Risemode Vision 01, TMICE Stream Controller
      placeholder: Mirabox 293S
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Binary version or git commit hash
      placeholder: 40048e7
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you observe, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal, exact steps.
      placeholder: |
        1. Run ./deckbridge ...
        2. Connect Elgato software ...
        3. Press key ...
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics report
      description: >-
        Paste the output of `./deckbridge diagnose` (or use **Settings → Create
        diagnostics report** in the web UI). Run it with the device connected.


        **Turn on debug logging first** — web UI Settings → *Debug logging*, or
        `./deckbridge --log-level debug` — then reproduce the problem, then generate
        the report. If DeckBridge freezes before the web UI starts, `./deckbridge
        diagnose` still works: it runs before any server or device is opened.


        The report includes your settings, extra-key commands and local paths. Review
        it before posting, or re-run with `--redact-commands` to omit commands. See
        [Troubleshooting](https://deckbridge.dev/docs/troubleshooting).
      render: shell
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Host OS
      description: e.g. macOS 15.5, Windows 11, Ubuntu 24.04
    validations:
      required: false
