[tools]
node = "24"
# Default aqua backend, NOT `npm:pnpm`: pnpm's npm tarball ships a placeholder `bin/pnpm`
# that only a postinstall swaps for the real binary, and mise's npm backend skips that, so
# `pnpm --version` dies with `SyntaxError: Unexpected identifier 'is'`. v12 is the floor —
# 12.1.0 restored `pnpm-darwin-x64`, without which aqua has no intel-macOS asset.
pnpm = "12"

# No `[tools."github:lukasMega/txiki.js"]` entry: $TJS is a vendor/ path filled by
# `mise run tjs-setup`, not a mise-managed tool — mise-action's blind `mise install`
# failed on platforms with no matching asset (kept linux out of release.yml).

[env]
# rustup's cargo. CI adds it to PATH itself but an interactive shell may not, and `_.path`
# prepends with the OS-correct separator — so tasks call plain `cargo` everywhere instead
# of a POSIX-only ${HOME}/.cargo/bin path.
_.path = ["~/.cargo/bin"]
# Release tag of lukasMega/txiki.js-with-slim-builds. Used by BOTH runtime paths:
# scripts/tjs-download.mjs (downloads the prebuilt `slim-ffi` asset) and
# scripts/tjs-build.mjs (clones this tag and builds it).
TXIKI_VERSION  = "slim-v26.6.0-9"
# Portable default: vendored build/download destination, per-platform exe suffix.
# Local overrides (a pre-built $TJS path, TJS_FROM_SOURCE=1) go in mise.local.toml
# (gitignored) — see that file's comment.
TJS             = "{{config_root}}/vendor/txiki.js/build/tjs{% if os() == 'windows' %}.exe{% endif %}"
DECKBRIDGE_NATIVE_LIB = "{{config_root}}/rust/target/release/{% if os() == 'windows' %}deckbridge_native.dll{% elif os() == 'macos' %}libdeckbridge_native.dylib{% else %}libdeckbridge_native.so{% endif %}"
DECKBRIDGE_TRAY_BIN        = "{{config_root}}/rust/target/release/deckbridge-tray{% if os() == 'windows' %}.exe{% endif %}"
DECKBRIDGE_RAW_DUMP_DIR="{{config_root}}/tmp/mira2el-raw"

[tasks.checkTjs]
description = "Print the active txiki.js runtime: path, version, size"
# No `$TJS --help`: the slim profile compiles the help/eval/serve subcommands out.
run = '''
echo "TJS: $TJS"
echo " - version: $($TJS --version)"
echo " - size:    $(du -k "$TJS" | cut -f1) kB"
'''

[tasks.s]
alias = ["start", "run"]
description = "Build and run (default UI: simple-only, no advanced/debug view)"
quiet = true
depends = ["build"]
run = "$TJS run ts/dist/bundle.js"

[tasks.s-advanced]
alias = ["start-advanced", "run-advanced"]
description = "Build and run with the advanced/debug view included"
quiet = true
depends = ["build-advanced"]
run = "$TJS run ts/dist/bundle.js"

[tasks.d]
description = "Rebuild at debug log level and run"
run = "LOG_LEVEL=debug mise run build && $TJS run ts/dist/bundle.js"

[tasks.gen-splash]
description = "Regenerate on-connect splash JPEG assets (run once after design changes)"
dir = "ts"
run = "node scripts/gen-splash.mjs"

[tasks.tjs-setup]
description = "Acquire the slim txiki.js runtime: prebuilt download by default, from-source build when TJS_FROM_SOURCE=1"
quiet = true
# Downloading by default keeps `mise run build` toolchain-free for contributors.
# TJS_FROM_SOURCE=1 is needed on macos-x86_64, which has no prebuilt slim asset.
run = "node scripts/tjs-setup.mjs"

[tasks.tjs-build]
description = "Build slim txiki.js from source (no sqlite3/wasm, stripped); needs cmake + C/C++ toolchain"
run = "node scripts/tjs-build.mjs"

[tasks.deckbridge-native]
description = "Build Rust native cdylib: image transform + HID enumeration (JPEG_FORK=1 = vendored optimized-Huffman jpeg-encoder fork, ~20% smaller files)"
quiet = true
dir = "rust/deckbridge-native"
run = "node ../../scripts/build-deckbridge-native.mjs"

[tasks.tray-rs]
description = "Build Rust system tray binary"
quiet = true
dir = "{{config_root}}/rust/deckbridge-tray"
depends = ["deckbridge-native"]
run = "cargo build --release"

[tasks.ts-install]
description = "Install TypeScript/esbuild dev dependencies"
quiet = true
dir = "ts"
run = "pnpm install --silent && echo pnpm install OK"

[tasks.ts]
description = "Bundle TypeScript with esbuild (simple-only UI: excludes the advanced view + its CSS)"
quiet = true
dir = "ts"
depends = ["ts-install", "deckbridge-native"]
run = "node build.mjs"

[tasks.build]
description = "Build everything (simple-only UI)"
quiet = true
depends = ["tjs-setup", "deckbridge-native", "tray-rs", "ts"]

[tasks.compile]
description = "Compile to standalone binary (simple-only UI — this is what release.yml ships)"
depends = ["build"]
run = "node scripts/compile.mjs"

[tasks.icons]
description = "Regenerate app + tray icons from the BridgeMark vector (needs rsvg-convert; commit the result)"
run = "node scripts/gen-icons.mjs"

[tasks.sync-version]
description = "Stamp ts/package.json's version into Cargo.toml/tauri.conf.json (CI-only, don't commit the result)"
run = "node scripts/sync-version.mjs"

[tasks.ts-advanced]
description = "Bundle TypeScript with the advanced/debug view included (opt-in, not shipped)"
quiet = true
dir = "ts"
depends = ["ts-install", "deckbridge-native"]
run = "node build.mjs --advanced"

[tasks.build-advanced]
description = "Build everything with the advanced/debug view included"
quiet = true
depends = ["tjs-setup", "deckbridge-native", "tray-rs", "ts-advanced"]

[tasks.compile-advanced]
description = "Compile the advanced-view standalone binary → deckbridge-advanced"
depends = ["build-advanced"]
run = "$TJS compile ts/dist/bundle.js deckbridge-advanced"

[tasks.package]
description = "Package compiled binary into a distributable zip (usage: mise run package -- v1.2.3)"
depends = ["compile"]
run = "node scripts/package.mjs ${1:-dev}"

[tasks.package-advanced]
description = "Package the advanced-view binary into a distributable zip (usage: mise run package-advanced -- v1.2.3)"
depends = ["compile-advanced"]
run = "SRC_BIN=deckbridge-advanced node scripts/package.mjs ${1:-dev}"

[tasks.lint]
description = "Lint with oxlint"
depends = ["ts-install"]
run = "./ts/node_modules/.bin/oxlint ts && echo 'oxlint done ✅, waiting for eslint...' && ./ts/node_modules/.bin/eslint ts"

[tasks.tauri-build]
description = "Build Windows NSIS installer via Tauri (compile + stage sidecars + pinned npm CLI)"
depends = ["compile", "tauri-install"]
run = "node scripts/tauri-build.mjs"

[tasks.tauri-install]
description = "Install pinned prebuilt Tauri CLI"
quiet = true
dir = "src-tauri"
run = "pnpm install --frozen-lockfile --silent && echo Tauri CLI install OK"

[tasks.tauri-build-macos]
description = "Build macOS .app + .dmg via Tauri (compile + stage sidecars + pinned npm CLI)"
depends = ["compile", "tauri-install"]
# macOS = Tauri Model A, ad-hoc (no Apple Developer ID). bundle.targets (app,dmg) +
# signingIdentity "-" + hardenedRuntime false live in src-tauri/tauri.macos.conf.json,
# auto-merged on macOS. hardenedRuntime stays OFF or library validation blocks the
# relay's extract+dlopen of libhidapi/libdeckbridge_native (plan gotcha G3).
#
# DO NOT re-codesign the relay binary. `tjs compile` appends the bytecode payload after
# the Mach-O __LINKEDIT under a linker-signed ad-hoc signature the kernel treats
# leniently; `codesign --force` swaps in a normal one, which strict-validates and rejects
# the trailing data → "main executable failed strict validation". Only deckbridge-tray (a
# plain Mach-O) is ad-hoc signed.
#
# chmod +x: `cp` onto an existing destination keeps the OLD mode, so a leftover
# non-executable stub would ship a non-runnable sidecar. CI=true skips bundle_dmg.sh's
# AppleScript window-styling pass, which needs a GUI/Automation grant.
run = """
TRIPLE="$(uname -m | sed 's/x86_64/x86_64/;s/arm64/aarch64/')-apple-darwin"
mkdir -p src-tauri/binaries
cp deckbridge                                  "src-tauri/binaries/deckbridge-${TRIPLE}"
cp rust/target/release/deckbridge-tray                "src-tauri/binaries/deckbridge-tray-${TRIPLE}"
chmod +x "src-tauri/binaries/deckbridge-${TRIPLE}" "src-tauri/binaries/deckbridge-tray-${TRIPLE}"
codesign --force --sign - --timestamp=none "src-tauri/binaries/deckbridge-tray-${TRIPLE}"
cd src-tauri && CI=true pnpm tauri build --bundles app,dmg
open target/release/bundle/macos
"""

[tasks.tauri-check]
description = "Cargo check the Tauri crate (cross-platform; auto-creates empty host-triple sidecar stubs so externalBin validates)"
dir = "src-tauri"
run = "node ../scripts/tauri-check-stubs.mjs && cargo check"

# fmt-check (member crates only — the vendored jpeg-encoder fork is excluded),
# clippy for both mutually-exclusive JPEG backends, then the unit tests.
# Sequential: parallel cargo races on rustup component downloads.
#
# The last clippy pass is the only one that sees mdns_windows.rs (it is
# `#[cfg(target_os = "windows")]`, so a host-only run skips the module entirely
# and a `-D warnings` failure there stays invisible until a Windows build).
# `usb` is off because hidapi's build script needs a real Windows toolchain to
# cross-compile; mdns_windows does not depend on it. Target comes from
# rust/rust-toolchain.toml, so rustup installs it on first use.
[tasks.rust-lint]
description = "Rust fmt-check + clippy + tests"
dir = "rust"
run = """
cargo fmt --check -p deckbridge-native -p deckbridge-tray
cargo clippy --workspace --all-targets -- -D warnings
cargo clippy -p deckbridge-native --no-default-features --features jpeg-fork,usb --all-targets -- -D warnings
cargo test --workspace
cargo clippy -p deckbridge-native --target x86_64-pc-windows-msvc --no-default-features --features jpeg-upstream --all-targets -- -D warnings
"""

[tasks.format]
description = "Format with oxfmt (single quotes)"
depends = ["ts-install"]
run = "./ts/node_modules/.bin/oxfmt ts/src ts/test docs-site/src docs-site/scripts e2e/fixtures e2e/helpers e2e/scripts e2e/tests e2e/playwright.config.ts e2e/global-setup.ts e2e/global-teardown.ts"

[tasks.check]
description = "Typecheck + lint + format check"
depends = ["types", "lint", "format"]

[tasks.types]
description = "Type-check TypeScript (no emit)"
dir = "ts"
depends = ["ts-install"]
run = "pnpm exec tsgo --noEmit"

[tasks.knip]
description = "Find unused files, exports, types, and dependencies (knip)"
dir = "ts"
depends = ["ts-install"]
run = "pnpm exec knip"

[tasks.loc]
description = "Top 10 largest .ts/.tsx files under ts/src by line count (excl. node_modules/dist/test, .d.ts)"
dir = "ts"
run = "node scripts/loc.mjs"

[tasks.check-loc]
description = "Fail (exit 1) if any .ts/.tsx file under ts/src exceeds 500 lines (test/ excluded)"
dir = "ts"
run = "node scripts/check-loc.mjs"


[tasks.docs-devices]
description = "Regenerate the device comparison docs from DEVICE_MODELS"
dir = "ts"
depends = ["ts-install"]
run = "node scripts/gen-device-docs.mjs"

[tasks.docs-devices-check]
description = "Fail if the generated device docs are stale vs DEVICE_MODELS"
dir = "ts"
depends = ["ts-install"]
run = "node scripts/gen-device-docs.mjs --check"

[tasks.ci-checks]
description = "Lint, typecheck, core/browser tests, knip, check-loc, and generated device docs in parallel"
depends = ["lint", "types", "test", "test-client", "knip", "check-loc", "docs-devices-check"]
timeout = "120s"

[tasks.beforeCommit]
description = "Format, lint, types, test, browser e2e, and compile — run before committing"
# e2e-browser is e2e-app + e2e-docs. e2e-docs carries `wait_for = ["docs-check"]`, so in
# this run it starts only once docs-check has produced docs-site/build/.
depends = ["format", "ci-checks", "rust-lint", "docs-check", "e2e-types", "e2e-browser", "compile"]
dir = "ts"
# 300s, not 150s: e2e-docs can't start until docs-check's Docusaurus build finishes.
timeout = "360s"

[tasks.smoke]
description = "Build and run USB HID smoke test (requires Mirabox device connected)"
depends = ["tjs-setup", "deckbridge-native"]
dir = "ts"
run = """
  node build.mjs --smoke
  DECKBRIDGE_NATIVE_LIB=$DECKBRIDGE_NATIVE_LIB $TJS run dist/mirabox-smoke.js
"""

[tasks.k1pro-probe]
description = "K1 Pro JPEG size-threshold probe - same pixels, COM-padded sizes (requires K1 Pro; Input Monitoring). Usage: mise run k1pro-probe [-- /path/to/jpeg-dir]"
depends = ["tjs-setup", "deckbridge-native"]
dir = "ts"
run = """
  node build.mjs --probe k1pro-probe
  DECKBRIDGE_NATIVE_LIB=$DECKBRIDGE_NATIVE_LIB $TJS run dist/k1pro-probe.js ${1:-}
"""

[tasks.d6-capture]
description = "Fifine D6 hardware capture: report descriptor + brightness sweep + JPEG size ladder (requires a D6; Input Monitoring). Usage: mise run d6-capture [-- s1,s3]"
depends = ["tjs-setup", "deckbridge-native"]
dir = "ts"
run = """
  node build.mjs --probe d6-capture
  DECKBRIDGE_NATIVE_LIB=$DECKBRIDGE_NATIVE_LIB $TJS run dist/d6-capture.js ${1:-}
"""

[tasks.akp05-capture]
description = "Ajazz AKP05/AKP05E raw input trace: encoder + touch-strip report codes (requires the device; Input Monitoring)"
depends = ["tjs-setup", "deckbridge-native"]
dir = "ts"
run = """
  node build.mjs --probe akp05-capture
  DECKBRIDGE_NATIVE_LIB=$DECKBRIDGE_NATIVE_LIB $TJS run dist/akp05-capture.js
"""

[tasks.akp05-strip-probe]
description = "Ajazz AKP05/AKP05E touch-strip output: JPEG size ladder (byte cap), slot origins and size, feature report 0x01 key check; answer in the browser page it opens on 127.0.0.1:3077 (requires the device; stop DeckBridge first)"
depends = ["tjs-setup", "deckbridge-native"]
dir = "ts"
run = """
  node build.mjs --probe akp05-strip-probe
  DECKBRIDGE_NATIVE_LIB=$DECKBRIDGE_NATIVE_LIB $TJS run dist/akp05-strip-probe.js
"""

[tasks.akp05-strip-guided-probe]
description = "Guided AKP05 strip probe: answer yes/no or numbers in terminal. Stop DeckBridge first. Optional: --dry-run"
depends = ["tjs-setup", "deckbridge-native"]
dir = "ts"
run = """
  node build.mjs --probe akp05-strip-guided-probe
  DECKBRIDGE_NATIVE_LIB=$DECKBRIDGE_NATIVE_LIB $TJS run dist/akp05-strip-guided-probe.js ${1:-}
"""

[tasks.e2e]
description = "Black-box smoke test of a packaged release zip (usage: mise run e2e -- dist/foo.zip)"
run = "./scripts/e2e-smoke.sh ${1:-}"
timeout = "30s"

# Playwright + Lightpanda browser e2e (e2e/)
# Lightpanda has no rendering/layout engine, so it boots in ~50ms but supports no
# screenshots, no boundingBox and no `locator.click()` — see e2e/helpers/click.ts.
[tasks.e2e-install]
description = "Install the Playwright e2e suite's dependencies"
dir = "e2e"
# The bundled Chromium is never launched (Lightpanda is the runtime; the E2E_BROWSER=chromium
# triage path uses $CHROME_BIN / a system install), so skip the ~150 MB download.
env = { PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1" }
run = "pnpm install --silent && echo e2e pnpm install OK"

[tasks.e2e-app]
description = "Browser e2e: the DeckBridge Web UI in mock mode (needs CORA ports 5343/5344 free)"
dir = "e2e"
depends = ["build", "e2e-install"]
run = "pnpm run test:app"
timeout = "180s"

[tasks.e2e-docs]
description = "Browser e2e: the built Docusaurus site (run `mise run docs-build` first)"
dir = "e2e"
depends = ["e2e-install"]
# wait_for, not `depends`: standalone this task must fail in seconds with "run mise run
# docs-build first" instead of silently triggering a multi-minute Docusaurus build. Within
# beforeCommit, docs-check produces docs-site/build/ and wait_for stops the two racing.
wait_for = ["docs-check"]
run = "pnpm run test:docs"
timeout = "180s"

[tasks.e2e-browser]
alias = ["e2e-all"]
description = "All browser e2e suites (app + docs)"
depends = ["e2e-app", "e2e-docs"]

[tasks.e2e-types]
description = "Type-check the e2e suite"
dir = "e2e"
depends = ["e2e-install"]
run = "pnpm run types"

[tasks.test]
description = "Run tests (TJS)"
quiet = true
depends = ["ts-install", "tjs-setup", "deckbridge-native"]
run = "node scripts/run-tests.mjs"
timeout = "120s"

[tasks.test-client]
description = "Run Preact browser regression tests"
dir = "ts"
depends = ["ts-install"]
run = "pnpm run test:client"
# The script's own browser budget is 90s; keep this clear of it so a browser timeout
# fails with the script's diagnostic (Chrome path + stderr) instead of a bare task kill.
timeout = "150s"

[tasks.docs-install]
description = "Install docs-site pnpm dependencies"
dir = "docs-site"
run = "pnpm install"

[tasks.docs-dev]
description = "Start Docusaurus dev server (docs-site)"
dir = "docs-site"
# --port pins 3001 so an ambient PORT (e.g. from idf.py flash) can't make Docusaurus
# parse port NaN. `pnpm exec`, not `pnpm run start --`: pnpm forwards the bare `--` and
# Docusaurus reads it as the positional siteDir.
run = "pnpm exec docusaurus start --port 3001 --host 0.0.0.0"

[tasks.docs-check]
description = "docs-site: typecheck + tests (build/links/content/output)"
dir = "docs-site"
depends = ["docs-install"]
run = "pnpm run beforeCommit"

[tasks.docs-build]
description = "Build Docusaurus static HTML (docs-site/build/)"
dir = "docs-site"
run = "pnpm run test && pnpm run build"

[tasks.docs-serve]
description = "Serve the built Docusaurus site locally"
dir = "docs-site"
run = "pnpm run serve -- --port 3000"

[tasks.coverage]
description = "Run the tjs test suite with Istanbul instrumentation and emit a merged coverage report (text/html/lcov)"
dir = "ts"
depends = ["deckbridge-native"]
run = """
  rm -rf coverage/.tmp && mkdir -p coverage/.tmp
  for f in test/*.test.ts; do
    testname=$(basename $f .test.ts)
    node build.mjs --test $testname --coverage && $TJS run dist/test/$testname.js
  done
  node scripts/coverage-report.mjs
"""
timeout = "120s"

[tasks.video-dev]
description = "Remotion Studio for the product video (video/)"
dir = "video"
run = "npm run dev"

[tasks.video-shots]
description = "Recapture the web UI screenshots the video zooms into (needs DeckBridge running)"
dir = "video"
run = "node scripts/shots.mjs"

[tasks.video-clips]
description = "Record the real web UI as video clips for the tour (needs DeckBridge running)"
dir = "video"
run = "node scripts/clips.mjs"
timeout = "1800s"

[tasks.video-manual]
description = "Placeholders for the hand-taken captures (tray, Elgato app) — see video/MANUAL.md"
dir = "video"
run = "node scripts/manual-placeholders.mjs"

[tasks.video-render]
description = "Render the footage tour, both cuts -> video/out/"
dir = "video"
run = """
  npm run render
  npm run render:vertical
"""
timeout = "1800s"

[tasks.video-render-teaser]
description = "Render the 30 s teaser, both cuts -> video/out/"
dir = "video"
run = """
  npm run render:teaser
  npm run render:teaser-vertical
"""
timeout = "1800s"
