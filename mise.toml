[tools]
node = "24"
# docs-analytics/ is a Deno project (the collector deploys to Deno Deploy).
# Declared here so `mise run analytics-check` is reproducible instead of relying
# on whatever `deno` happens to be on PATH.
deno = "2"

# NOTE: no `[tools."github:lukasMega/txiki.js"]` entry on purpose. $TJS below is
# an explicit vendor/ path filled by `mise run tjs-setup`, so a mise-managed tool
# was never actually used — and mise-action's blind `mise install` failed on
# platforms with no matching asset (that's what kept linux out of release.yml).

[env]
# rustup installs cargo here; CI (dtolnay/rust-toolchain) adds it to PATH itself,
# but a plain interactive shell may not (no `source $HOME/.cargo/env` in rc files
# — confirmed missing here). mise's `_.path` prepends it with the OS-correct
# separator, so tasks can call plain `cargo` on every platform without
# hardcoding a POSIX-only ${HOME}/.cargo/bin/cargo path (broken on Windows).
_.path = ["~/.cargo/bin"]
# Release tag of lukasMega/txiki.js-with-slim-builds. Used by BOTH runtime paths:
# scripts/tjs-download.mjs (downloads the prebuilt `slim-ffi` asset) and
# scripts/tjs-build.mjs (clones this tag and builds it).
TXIKI_VERSION  = "slim-v26.6.0-6"
# Portable default: vendored build/download destination, per-platform exe suffix.
# Local overrides (a pre-built $TJS path, TJS_FROM_SOURCE=1) go in mise.local.toml
# (gitignored) — see that file's comment.
TJS             = "{{config_root}}/vendor/txiki.js/build/tjs{% if os() == 'windows' %}.exe{% endif %}"
DECKBRIDGE_NATIVE_LIB = "{{config_root}}/rust/target/release/{% if os() == 'windows' %}deckbridge_native.dll{% elif os() == 'macos' %}libdeckbridge_native.dylib{% else %}libdeckbridge_native.so{% endif %}"
DECKBRIDGE_TRAY_BIN        = "{{config_root}}/rust/target/release/deckbridge-tray{% if os() == 'windows' %}.exe{% endif %}"
DECKBRIDGE_RAW_DUMP_DIR="{{config_root}}/tmp/mira2el-raw"

[tasks.checkTjs]
description = "Print the active txiki.js runtime: path, version, size"
# No `$TJS --help`: the slim profile compiles the help/eval/serve subcommands out.
run = '''
echo "TJS: $TJS"
echo " - version: $($TJS --version)"
echo " - size:    $(du -k "$TJS" | cut -f1) kB"
'''

# DECKBRIDGE_NATIVE_LIB / DECKBRIDGE_TRAY_BIN come from [env] above — mise already
# exports them into every task, so the run lines don't repeat them.
[tasks.s]
alias = ["start", "run"]
description = "Build and run"
quiet = true
depends = ["build"]
run = "$TJS run ts/dist/bundle.js"

[tasks.s-simple]
alias = ["start-simple", "run-simple"]
description = "Build and run the simple-only UI (no advanced/debug view)"
quiet = true
depends = ["build-simple"]
run = "$TJS run ts/dist/bundle.js"

[tasks.d]
description = "Rebuild at debug log level and run"
run = "LOG_LEVEL=debug mise run build && $TJS run ts/dist/bundle.js"

[tasks.gen-splash]
description = "Regenerate on-connect splash JPEG assets (run once after design changes)"
dir = "ts"
run = "node scripts/gen-splash.mjs"

[tasks.tjs-setup]
description = "Acquire the slim txiki.js runtime: prebuilt download by default, from-source build when TJS_FROM_SOURCE=1"
quiet = true
# Default (no env): download the prebuilt `slim-ffi` asset of $TXIKI_VERSION —
# no C/C++ toolchain needed, so a contributor can always `mise run build`.
# TJS_FROM_SOURCE=1 builds the same runtime from source instead (needed on
# macos-x86_64, which has no prebuilt slim asset).
run = "node scripts/tjs-setup.mjs"

[tasks.tjs-build]
description = "Build slim txiki.js from source (no sqlite3/wasm, stripped); needs cmake + C/C++ toolchain"
run = "node scripts/tjs-build.mjs"

[tasks.deckbridge-native]
description = "Build Rust native cdylib: image transform + HID enumeration (JPEG_FORK=1 = vendored optimized-Huffman jpeg-encoder fork, ~20% smaller files)"
quiet = true
dir = "rust/deckbridge-native"
run = "node ../../scripts/build-deckbridge-native.mjs"

[tasks.tray-rs]
description = "Build Rust system tray binary"
quiet = true
dir = "{{config_root}}/rust/deckbridge-tray"
depends = ["deckbridge-native"]
run = "cargo build --release"

[tasks.ts-install]
description = "Install TypeScript/esbuild dev dependencies"
quiet = true
dir = "ts"
run = "npm i --no-fund --no-audit --silent && echo npm install OK"

[tasks.ts]
description = "Bundle TypeScript with esbuild"
quiet = true
dir = "ts"
depends = ["ts-install", "deckbridge-native"]
run = "node build.mjs"

[tasks.build]
description = "Build everything"
quiet = true
depends = ["tjs-setup", "deckbridge-native", "tray-rs", "ts"]

[tasks.compile]
description = "Compile to standalone binary"
depends = ["build"]
run = "node scripts/compile.mjs"

[tasks.sync-version]
description = "Stamp ts/package.json's version into Cargo.toml/tauri.conf.json (CI-only, don't commit the result)"
run = "node scripts/sync-version.mjs"

[tasks.ts-simple]
description = "Bundle TypeScript (simple-only: excludes advanced view + its CSS)"
quiet = true
dir = "ts"
depends = ["ts-install", "deckbridge-native"]
run = "node build.mjs --simple-only"

[tasks.build-simple]
description = "Build everything with the simple-only UI (no advanced/debug view)"
quiet = true
depends = ["tjs-setup", "deckbridge-native", "tray-rs", "ts-simple"]

[tasks.compile-simple]
description = "Compile the simple-only standalone binary → deckbridge-lite"
depends = ["build-simple"]
run = "$TJS compile ts/dist/bundle.js deckbridge-lite"

[tasks.package]
description = "Package compiled binary into a distributable zip (usage: mise run package -- v1.2.3)"
depends = ["compile"]
run = "node scripts/package.mjs ${1:-dev}"

[tasks.package-simple]
description = "Package the simple-only (lite) binary into a distributable zip (usage: mise run package-simple -- v1.2.3)"
depends = ["compile-simple"]
run = "SRC_BIN=deckbridge-lite node scripts/package.mjs ${1:-dev}"

[tasks.lint]
description = "Lint with oxlint"
depends = ["ts-install"]
run = "./ts/node_modules/.bin/oxlint ts && ./ts/node_modules/.bin/eslint ts"

[tasks.tauri-build]
description = "Build Windows NSIS installer via Tauri (runs: compile + tray + copy sidecars + cargo tauri build)"
depends = ["compile", "tray-rs"]
run = "node scripts/tauri-build.mjs"

[tasks.tauri-build-macos]
description = "Build macOS .app + .dmg via Tauri (compile + tray + sidecars renamed to apple-darwin triple + cargo tauri build --bundles app,dmg)"
depends = ["compile", "tray-rs"]
# macOS = Tauri Model A, ad-hoc (no Apple Developer ID). The macOS bundle.targets
# (app,dmg) + signingIdentity "-" + hardenedRuntime false live in
# src-tauri/tauri.macos.conf.json, which Tauri auto-merges on macOS (RFC 7396 —
# its targets array REPLACES the base ["nsis"], so nsis never leaks here). We also
# pass --bundles app,dmg explicitly as belt-and-suspenders. hardenedRuntime stays
# OFF so the relay's extract+dlopen of libhidapi/libdeckbridge_native isn't blocked by
# library validation (plan gotcha G3).
#
# DO NOT re-codesign the relay binary: `tjs compile` appends the bytecode payload
# AFTER the Mach-O __LINKEDIT, and ships a linker-signed ad-hoc signature the
# kernel runs leniently (the appended bytes are never mapped). `codesign --force`
# replaces that special signature with a normal one and runs strict validation,
# which rejects the trailing data → "main executable failed strict validation".
# So the relay keeps its as-compiled linker-signed signature; only deckbridge-tray (a
# plain Mach-O) is ad-hoc signed.
#
# chmod +x: `cp` over a pre-existing destination keeps the OLD file's mode, so a
# leftover non-executable stub would yield a non-runnable sidecar in the bundle.
# CI=true: skips bundle_dmg.sh's AppleScript/Finder window-styling pass, which
# needs a GUI/Automation grant and fails in a plain terminal (GitHub Actions sets
# CI automatically, so the release job is unaffected either way).
run = """
TRIPLE="$(uname -m | sed 's/x86_64/x86_64/;s/arm64/aarch64/')-apple-darwin"
mkdir -p src-tauri/binaries
cp deckbridge                                  "src-tauri/binaries/deckbridge-${TRIPLE}"
cp rust/target/release/deckbridge-tray                "src-tauri/binaries/deckbridge-tray-${TRIPLE}"
chmod +x "src-tauri/binaries/deckbridge-${TRIPLE}" "src-tauri/binaries/deckbridge-tray-${TRIPLE}"
codesign --force --sign - --timestamp=none "src-tauri/binaries/deckbridge-tray-${TRIPLE}"
cd src-tauri && CI=true cargo tauri build --bundles app,dmg
open target/release/bundle/macos
"""

[tasks.tauri-check]
description = "Cargo check the Tauri crate (cross-platform; auto-creates empty host-triple sidecar stubs so externalBin validates)"
dir = "src-tauri"
run = "node ../scripts/tauri-check-stubs.mjs && cargo check"

# fmt-check (member crates only — the vendored jpeg-encoder fork is excluded),
# clippy for both mutually-exclusive JPEG backends, then the unit tests.
# Sequential: parallel cargo races on rustup component downloads.
[tasks.rust-lint]
description = "Rust fmt-check + clippy + tests"
dir = "rust"
run = """
cargo fmt --check -p deckbridge-native -p deckbridge-tray
cargo clippy --workspace --all-targets -- -D warnings
cargo clippy -p deckbridge-native --no-default-features --features jpeg-fork,usb --all-targets -- -D warnings
cargo test --workspace
"""

[tasks.format]
description = "Format with oxfmt (single quotes)"
depends = ["ts-install"]
run = "./ts/node_modules/.bin/oxfmt ts/src ts/test docs-site/src docs-site/scripts"

[tasks.check]
description = "Typecheck + lint + format check"
depends = ["types", "lint", "format"]

[tasks.types]
description = "Type-check TypeScript (no emit)"
dir = "ts"
depends = ["ts-install"]
run = "npx tsgo --noEmit"

[tasks.knip]
description = "Find unused files, exports, types, and dependencies (knip)"
dir = "ts"
depends = ["ts-install"]
run = "npx knip"

[tasks.loc]
description = "Top 10 largest .ts/.tsx files under ts/src by line count (excl. node_modules/dist/test, .d.ts)"
dir = "ts"
run = "node scripts/loc.mjs"

[tasks.check-loc]
description = "Fail (exit 1) if any .ts/.tsx file under ts/src exceeds 500 lines (test/ excluded)"
dir = "ts"
run = "node scripts/check-loc.mjs"

[tasks.analytics-check]
description = "docs-analytics (Deno collector): lint, typecheck, tests"
dir = "docs-analytics"
# `deno fmt` is deliberately NOT run: it disagrees with the repo's oxfmt style
# (it unwraps the aligned ternary chains in main.ts's parseUA) and the vendored
# uPlot assets are excluded in deno.json. Formatting for this dir stays manual.
# `deno task test` (not a raw `deno test`) so the permission flags have one home.
run = """
deno lint
deno check main.ts main_test.ts
deno task test
"""

[tasks.ci-checks]
description = "Lint, typecheck, test, knip (unused files/exports/deps), and check-loc in parallel (after format)"
depends = ["lint", "types", "test", "knip", "check-loc"]
timeout = "120s"

[tasks.beforeCommit]
description = "Format, lint, types, test, and compile — run before committing"
depends = ["format", "ci-checks", "rust-lint", "analytics-check", "docs-check", "compile"]
dir = "ts"
# run = "npm run beforeCommit"
timeout = "150s"

[tasks.smoke]
description = "Build and run USB HID smoke test (requires Mirabox device connected)"
depends = ["tjs-setup", "deckbridge-native"]
dir = "ts"
run = """
  node build.mjs --smoke
  DECKBRIDGE_NATIVE_LIB=$DECKBRIDGE_NATIVE_LIB $TJS run dist/mirabox-smoke.js
"""

[tasks.k1pro-probe]
description = "K1 Pro JPEG size-threshold probe - same pixels, COM-padded sizes (requires K1 Pro; Input Monitoring/sudo)"
depends = ["tjs-setup", "deckbridge-native"]
dir = "ts"
run = """
  node build.mjs --probe
  DECKBRIDGE_NATIVE_LIB=$DECKBRIDGE_NATIVE_LIB $TJS run dist/k1pro-probe.js
"""

[tasks.e2e]
description = "Black-box smoke test of a packaged release zip (usage: mise run e2e -- dist/foo.zip)"
run = "./scripts/e2e-smoke.sh ${1:-}"
timeout = "30s"

[tasks.test]
description = "Run tests (TJS)"
quiet = true
depends = ["ts-install", "tjs-setup", "deckbridge-native"]
run = "node scripts/run-tests.mjs"
timeout = "90s"

[tasks.docs-install]
description = "Install docs-site npm dependencies"
dir = "docs-site"
run = "npm install --no-fund"

[tasks.docs-dev]
description = "Start Docusaurus dev server (docs-site)"
dir = "docs-site"
# --port pins 3000 so an ambient PORT (e.g. PORT=/dev/cu.usbserial-* from idf.py flash) can't make Docusaurus parse port NaN
run = "npm run start -- --port 3001 --host 0.0.0.0"

[tasks.docs-check]
description = "docs-site: typecheck + tests (build/links/content/output)"
dir = "docs-site"
depends = ["docs-install"]
run = "npm run beforeCommit"

[tasks.docs-build]
description = "Build Docusaurus static HTML (docs-site/build/)"
dir = "docs-site"
run = "npm run test && npm run build"

[tasks.docs-serve]
description = "Serve the built Docusaurus site locally"
dir = "docs-site"
run = "npm run serve -- --port 3000"

[tasks.coverage]
description = "Run the tjs test suite with Istanbul instrumentation and emit a merged coverage report (text/html/lcov)"
dir = "ts"
depends = ["deckbridge-native"]
run = """
  rm -rf coverage/.tmp && mkdir -p coverage/.tmp
  for f in test/*.test.ts; do
    testname=$(basename $f .test.ts)
    node build.mjs --test $testname --coverage && $TJS run dist/test/$testname.js
  done
  node scripts/coverage-report.mjs
"""
timeout = "120s"
