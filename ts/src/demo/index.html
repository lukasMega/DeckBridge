<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>DeckBridge live demo</title>
    <link rel="stylesheet" href="ui.css" />
    <script>
      (function () {
        var theme;
        try {
          theme = parent.document.documentElement.getAttribute('data-theme');
        } catch (_) {}
        if (!theme)
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="demo-bar"></div>
    <div id="simple-view"></div>
    <script src="demo.js"></script>
  </body>
</html>
