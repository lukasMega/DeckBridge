# pnpm 11 defaults strictDepBuilds=true and reads settings here, not package.json.
# These dependencies compile native bindings or resolve a platform binary.
allowBuilds:
  "esbuild": true
  "unrs-resolver": true

minimumReleaseAgeExclude:
  - preact@11.0.1

# Keep transitive browser data tooling above security-fix floors.
# Drop these once all direct parents resolve fixed releases themselves.
overrides:
  browserslist: "^4.28.7"
  # 4.7.10 fixes AST injection, constructor access, and inline script escaping.
  handlebars: "^4.7.10"
  # 11.0.1 fixes globParts amplification DoS (GHSA, Dependabot #117); eslint plugins still pin ^10.
  minimatch: "^11.0.5"

# Share the docs build's nesting guard with ESLint's transitive braces copy.
patchedDependencies:
  braces@3.0.3: ../patches/braces@3.0.3.patch
