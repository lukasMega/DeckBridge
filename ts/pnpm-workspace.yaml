# pnpm 11 defaults strictDepBuilds=true and reads settings here, not package.json.
# These dependencies compile native bindings or resolve a platform binary.
allowBuilds:
  "esbuild": true
  "unrs-resolver": true

# Keep transitive browser data tooling above security-fix floors.
# Drop these once all direct parents resolve fixed releases themselves.
overrides:
  browserslist: "^4.28.7"
  baseline-browser-mapping: "^2.11.0"
